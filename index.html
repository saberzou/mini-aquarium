<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Koi Pond</title>
  <meta name="description" content="A quiet pond of your own. Feed the koi, listen to the rain, and take a breath.">
  <meta name="theme-color" content="#769E8F">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #3D7A7E; }
    #liquid-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    #fish-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 2;
      cursor: pointer;
    }

    .weather-tabs {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 0;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 3px;
    }
    .weather-tab {
      padding: 0 18px;
      height: 38px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
      cursor: pointer;
      border-radius: 100px;
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .weather-tab svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .weather-tab.active {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    /* Add Koi button */
    #add-koi-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.8);
      font-size: 24px;
      line-height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      text-indent: 0;
      font-family: system-ui, sans-serif;
      font-weight: 300;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      transform: rotate(0deg) scale(1);
    }
    #add-koi-btn:hover {
      background: rgba(0,0,0,0.4);
      color: #fff;
      transform: rotate(0deg) scale(1);
    }
    #add-koi-btn.panel-open {
      transform: rotate(45deg) scale(1);
    }
    #add-koi-btn.panel-open:hover {
      transform: rotate(45deg) scale(1);
    }

    /* Koi selector panel */
    #koi-panel {
      position: fixed;
      bottom: 80px;
      right: 16px;
      z-index: 10;
      width: min(360px, calc(100vw - 32px));
      max-height: min(480px, calc(100vh - 120px));
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 12px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      opacity: 0;
      transform: translateY(12px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    @media (max-width: 400px) {
      #koi-panel {
        grid-template-columns: repeat(2, 1fr);
        right: 8px;
        left: 8px;
        width: auto;
      }
    }
    #koi-panel.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .koi-card {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    .koi-card:hover {
      background: rgba(255,255,255,0.18);
      transform: scale(1.04);
    }
    .koi-card:active {
      transform: scale(0.97);
    }
    .koi-card.in-pond {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .koi-card.in-pond .koi-status {
      display: block;
    }
    .koi-status {
      display: none;
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ADE80;
      box-shadow: 0 0 4px rgba(74,222,128,0.6);
    }
    .koi-card {
      position: relative;
    }
    .koi-swatch {
      width: 72px;
      height: 40px;
      flex-shrink: 0;
    }
    .koi-name {
      font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      text-align: center;
      line-height: 1.2;
    }
    .koi-name-en {
      font-size: 9px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      line-height: 1.2;
    }
    .koi-desc {
      font-size: 9px;
      color: rgba(255,255,255,0.45);
      text-align: center;
      line-height: 1.3;
    }

    /* Scrollbar styling */
    #koi-panel::-webkit-scrollbar { width: 4px; }
    #koi-panel::-webkit-scrollbar-track { background: transparent; }
    #koi-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    /* Breathing button (left side, symmetric with add-koi) */
    #breathing-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 10;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #breathing-btn:hover {
      background: rgba(0,0,0,0.4);
      color: #fff;
    }

    /* ---- Breathing mode ---- */
    @keyframes breathe-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(180,220,255,0); }
      50%       { box-shadow: 0 0 14px 5px rgba(140,200,255,0.5); }
    }
    #breathing-btn.breathing-active {
      animation: breathe-glow 4s ease-in-out infinite;
      background: rgba(0,0,0,0.4);
      color: #fff;
    }

    /* Music button */
    #music-btn {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #music-btn:hover {
      background: rgba(0,0,0,0.4);
      color: #fff;
    }
    #music-btn.playing {
      background: rgba(0,0,0,0.25);
      color: rgba(255,255,255,0.8);
    }
    #music-btn .bar { display: inline-block; width: 3px; background: currentColor; border-radius: 1.5px; margin: 0 1px; transition: height 0.3s ease; }
    #music-btn .bar:nth-child(1) { height: 8px; }
    #music-btn .bar:nth-child(2) { height: 14px; }
    #music-btn .bar:nth-child(3) { height: 10px; }
    #music-btn .bar:nth-child(4) { height: 16px; }
    #music-btn.paused .bar { height: 3px !important; }
    @keyframes bar-bounce {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.4); }
    }
    #music-btn.playing .bar:nth-child(1) { animation: bar-bounce 0.8s ease-in-out infinite 0s; }
    #music-btn.playing .bar:nth-child(2) { animation: bar-bounce 0.8s ease-in-out infinite 0.2s; }
    #music-btn.playing .bar:nth-child(3) { animation: bar-bounce 0.8s ease-in-out infinite 0.4s; }
    #music-btn.playing .bar:nth-child(4) { animation: bar-bounce 0.8s ease-in-out infinite 0.1s; }

    /* Language toggle (top-right, symmetric with music button top-left) */
    #lang-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 10;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      font-weight: 600;
      font-family: -apple-system, "PingFang SC", "SF Pro Text", "Helvetica Neue", sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #lang-btn:hover {
      background: rgba(0,0,0,0.4);
      color: #fff;
    }
    #lang-btn:active {
      transform: scale(0.92);
    }

    #breathing-overlay {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #breathing-label {
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 16px;
      padding: 10px 22px;
      color: rgba(255,255,255,0.92);
      font-family: -apple-system, "PingFang SC", "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.04em;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
    }
    #breathing-label.visible {
      opacity: 1;
      transform: translateY(0);
    }

  </style>

<body>
  <canvas id="liquid-canvas" aria-hidden="true"></canvas>
  <canvas id="fish-canvas" role="img" aria-label="Interactive koi pond"></canvas>
  <div id="pond-hint" data-i18n="hint">Tap for ripples · Hold to feed</div>
  <div class="weather-tabs">
    <button class="weather-tab active" data-weather="sunny"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><span data-i18n="sunny">晴</span></button>
    <button class="weather-tab" data-weather="rainy"><svg viewBox="0 0 24 24"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M16 14v6M8 14v6M12 16v6"/></svg><span data-i18n="rainy">雨</span></button>
  </div>

  <!-- Background music -->
  <audio id="bg-music" loop preload="auto" src="cobblestone_mornings.mp3"></audio>
  <audio id="breathing-music" loop preload="auto" src="ethereal_resonance.mp3"></audio>
  <button id="music-btn" class="paused" title="音乐" data-i18n-title="music"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>

  <!-- Language toggle (label shows the language you'd switch TO) -->
  <button id="lang-btn" title="Switch language">EN</button>

  <!-- Breathing button (left side, symmetric with add-koi on right) -->
  <button id="breathing-btn" title="呼吸模式" data-i18n-title="breathing"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg></button>

  <!-- Breathing phase label overlay -->
  <div id="breathing-overlay">
    <div id="breathing-label"></div>
  </div>

  <!-- Add Koi floating button -->
  <button id="add-koi-btn" aria-expanded="false" aria-controls="koi-panel" title="添加锦鲤" data-i18n-title="addKoi"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>

  <!-- Koi variety selector panel -->
  <div id="koi-panel" role="group" aria-label="Pond companions" inert>
    <div class="companion-tabs" role="tablist" aria-label="Categories" id="companion-tabs">
      <button type="button" id="tab-koi" role="tab" aria-selected="true" aria-controls="koi-grid" data-i18n="koiCategory">Koi</button>
      <button type="button" id="tab-animals" role="tab" aria-selected="false" aria-controls="animal-grid" tabindex="-1" data-i18n="animalCategory">Other animals</button>
    </div>
    <div class="companion-content">
      <div id="koi-grid" class="companion-grid" role="tabpanel" aria-labelledby="tab-koi"></div>
      <div id="animal-grid" class="companion-grid animal-grid" role="tabpanel" aria-labelledby="tab-animals" hidden></div>
    </div>
  </div>

  <script>
    // ---- Localization (EN / 中) ----
    const I18N = {
      zh: {
        sunny: '晴', rainy: '雨', hint: '轻触泛起涟漪 · 长按喂鱼', pond: '可互动的锦鲤池', choose: '池塘伙伴', koiCategory: '锦鲤', animalCategory: '其他动物', inPond: '已在池中',
        music: '音乐', breathing: '呼吸模式', addKoi: '池塘伙伴',
        inhale: '吸气...', exhale: '呼气...',
        toggleLabel: 'EN',        // button shows the language you switch TO
        toggleTitle: '切换语言',
      },
      en: {
        sunny: 'Sunny', rainy: 'Rainy', hint: 'Tap for ripples · Hold to feed', pond: 'Interactive koi pond', choose: 'Pond companions', koiCategory: 'Koi', animalCategory: 'Other animals', inPond: 'In your pond',
        music: 'Music', breathing: 'Breathing', addKoi: 'Pond companions',
        inhale: 'Inhale...', exhale: 'Exhale...',
        toggleLabel: '中',
        toggleTitle: 'Switch language',
      },
    };

    // Default to saved preference, else the browser's language
    function storedLanguage() { try { return localStorage.getItem('koi-lang'); } catch { return null; } }
    let currentLang = storedLanguage()
      || (navigator.language && navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en');

    const langListeners = [];
    window.onLangChange = (fn) => { langListeners.push(fn); fn(currentLang); };
    window.getLang = () => currentLang;
    window.t = (key) => (I18N[currentLang] && I18N[currentLang][key]) || key;

    function applyLanguage(lang) {
      currentLang = I18N[lang] ? lang : 'en';
      try { localStorage.setItem('koi-lang', currentLang); } catch {}
      const dict = I18N[currentLang];
      document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';

      // Text content
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (dict[key]) el.textContent = dict[key];
      });
      // Title attributes
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.dataset.i18nTitle;
        if (dict[key]) { el.title = dict[key]; el.setAttribute('aria-label', dict[key]); }
      });
      // Language button reflects the language you'd switch to
      const langBtn = document.getElementById('lang-btn');
      if (langBtn) { langBtn.textContent = dict.toggleLabel; langBtn.title = dict.toggleTitle; }

      document.getElementById('fish-canvas').setAttribute('aria-label', dict.pond);
      document.getElementById('koi-panel').setAttribute('aria-label', dict.choose);
      // Notify dynamic consumers (koi cards, breathing label)
      langListeners.forEach(fn => fn(currentLang));
    }

    document.getElementById('lang-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      applyLanguage(currentLang === 'zh' ? 'en' : 'zh');
    });

    // Apply once on load
    applyLanguage(currentLang);

    // Weather tabs
    document.querySelector('.weather-tabs').addEventListener('click', e => {
      const btn = e.target.closest('.weather-tab');
      if (!btn) return;
      document.querySelectorAll('.weather-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (window.setWeather) window.setWeather(btn.dataset.weather);
    });

    // Breathing button (standalone)
    document.getElementById('breathing-btn').addEventListener('click', () => {
      // Close koi panel if open
      const panel = document.getElementById('koi-panel');
      const koiBtn = document.getElementById('add-koi-btn');
      if (panel && panel.classList.contains('visible')) {
        panel.classList.remove('visible');
        panel.inert = true;
        koiBtn.setAttribute('aria-expanded', 'false');
        koiBtn && koiBtn.classList.remove('panel-open');
      }
      if (window.toggleBreathing) {
        const nowBreathing = window.toggleBreathing();
        if (nowBreathing && window._crossfadeToBreathing) window._crossfadeToBreathing();
        else if (!nowBreathing && window._crossfadeToNormal) window._crossfadeToNormal();
      }
    });

    // --- Breathing phase label loop ---
    let _lastPhase = null;
    const breathingLabel = document.getElementById('breathing-label');
    const breathingBtn   = document.getElementById('breathing-btn');

    // Re-render the label immediately if language changes mid-session
    window.onLangChange(() => {
      if (_lastPhase && breathingLabel) {
        breathingLabel.textContent = window.t(_lastPhase);
      }
    });

    function updateBreathingUI() {
      const active = window.isBreathingRequested && window.isBreathingRequested();
      if (breathingBtn) {
        breathingBtn.classList.toggle('active', !!active);
        breathingBtn.setAttribute('aria-pressed', String(!!active));
        breathingBtn.classList.toggle('breathing-active', !!active);
      }
      if (!active) {
        breathingLabel && breathingLabel.classList.remove('visible');
        _lastPhase = null;
        requestAnimationFrame(updateBreathingUI);
        return;
      }
      if (breathingLabel) {
        breathingLabel.classList.add('visible');
        const phase = window.__breathingPhase || 'inhale';
        if (phase !== _lastPhase) {
          // Fade out, swap text, fade in via CSS transition
          breathingLabel.classList.remove('visible');
          setTimeout(() => {
            if (!window.isBreathingRequested?.()) return;
            breathingLabel.textContent = window.t(phase);
            breathingLabel.classList.add('visible');
          }, 320);
          _lastPhase = phase;
        }
      }
      requestAnimationFrame(updateBreathingUI);
    }
    requestAnimationFrame(updateBreathingUI);
  </script>
  <script type="module" src="./js/audio.js?v=20261002"></script>
  <script type="module">
    import { ANIMALS, drawAnimalPreview } from './js/animals.js?v=20261002c';
    import { init } from './js/pond.js?v=20261002c';
    import { Fish } from './js/fish.js?v=20261002';
    import { KOI_VARIETIES } from './js/config.js?v=20261002';
    init();

    const btn = document.getElementById('add-koi-btn');
    const panel = document.getElementById('koi-panel');
    const koiGrid = document.getElementById('koi-grid');
    const animalGrid = document.getElementById('animal-grid');

    // Build koi cards
    function updateCardStates() {
      document.querySelectorAll('#koi-grid .koi-card').forEach(card => {
        const nameEn = card.dataset.variety;
        const inPond = window.hasFish && window.hasFish(nameEn);
        card.classList.toggle('in-pond', inPond);
        card.setAttribute('aria-pressed', String(!!inPond));
      });
    }

    // Card text elements keyed for language switching
    const cardLocalizers = [];

    KOI_VARIETIES.forEach(variety => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'koi-card';
      card.dataset.variety = variety.nameEn;

      // Green status dot
      const statusDot = document.createElement('div');
      statusDot.className = 'koi-status';
      statusDot.setAttribute('aria-hidden', 'true');
      card.appendChild(statusDot);

      // Canvas koi swatch
      const canvas = document.createElement('canvas');
      canvas.className = 'koi-swatch';
      canvas.width = 208;
      canvas.height = 112;
      canvas.setAttribute('aria-hidden', 'true');
      drawKoiSwatch(canvas, variety);

      const nameEl = document.createElement('div');
      nameEl.className = 'koi-name';

      const nameEnEl = document.createElement('div');
      nameEnEl.className = 'koi-name-en';

      const descEl = document.createElement('div');
      descEl.className = 'koi-desc';

      // Localizer: primary name = current language; secondary = the other
      cardLocalizers.push((lang) => {
        if (lang === 'en') {
          nameEl.textContent = variety.nameEn;
          nameEnEl.textContent = variety.name;
          descEl.textContent = variety.descEn || variety.desc;
        } else {
          nameEl.textContent = variety.name;
          nameEnEl.textContent = variety.nameEn;
          descEl.textContent = variety.desc;
        }
      });

      card.appendChild(canvas);
      card.appendChild(nameEl);
      card.appendChild(nameEnEl);
      card.appendChild(descEl);

      card.addEventListener('click', () => {
        const inPond = window.hasFish && window.hasFish(variety.nameEn);
        if (inPond) {
          window.removeFish && window.removeFish(variety.nameEn);
        } else {
          window.addFish && window.addFish(variety);
        }
        updateCardStates();
      });

      koiGrid.appendChild(card);
    });

    ANIMALS.forEach(animal => {
      const card = document.createElement('button');
      card.type = 'button'; card.className = 'koi-card animal-card';
      card.dataset.animal = animal.id;
      const dot = document.createElement('span'); dot.className = 'koi-status'; dot.setAttribute('aria-hidden','true');
      const canvas = document.createElement('canvas'); canvas.width = 208; canvas.height = 112;
      canvas.className = 'koi-swatch'; canvas.setAttribute('aria-hidden','true');
      drawAnimalPreview(canvas,animal.id);
      const name = document.createElement('span'); name.className = 'koi-name';
      const desc = document.createElement('span'); desc.className = 'koi-desc';
      const status = document.createElement('span'); status.className = 'animal-selection'; status.setAttribute('aria-hidden','true');
      const update = () => {
        const selected = window.hasAnimal(animal.id);
        card.classList.toggle('in-pond',selected); card.setAttribute('aria-pressed',String(selected));
        status.textContent = selected ? (window.getLang()==='zh' ? '已在池中' : 'In your pond') : (window.getLang()==='zh' ? '添加' : 'Add');
      };
      cardLocalizers.push(lang=>{
        name.textContent = lang==='zh' ? animal.name : animal.nameEn;
        desc.textContent = lang==='zh' ? animal.desc : animal.descEn; update();
      });
      card.addEventListener('click',()=>{window.setAnimalEnabled(animal.id,!window.hasAnimal(animal.id));update();});
      card.append(dot,canvas,name,desc,status); animalGrid.appendChild(card); update();
    });
    const categoryTabs = [...document.querySelectorAll('.companion-tabs [role="tab"]')];
    function selectCategory(index, focus = false) {
      categoryTabs.forEach((tab,i)=>{
        tab.setAttribute('aria-selected',String(i===index)); tab.tabIndex=i===index ? 0 : -1;
      });
      koiGrid.hidden = index !== 0; animalGrid.hidden = index !== 1;
      document.querySelector('.companion-content').scrollTop = 0;
      if(focus) categoryTabs[index].focus();
    }
    categoryTabs.forEach((tab,index)=>{
      tab.addEventListener('click',()=>selectCategory(index));
      tab.addEventListener('keydown',event=>{
        let next;
        if(event.key==='ArrowRight' || event.key==='ArrowLeft') next=1-index;
        else if(event.key==='Home') next=0;
        else if(event.key==='End') next=1;
        else return;
        event.preventDefault(); selectCategory(next,true);
      });
    });

    // Keep card text in sync with the active language
    window.onLangChange(lang => cardLocalizers.forEach(fn => fn(lang)));
    updateCardStates();
    setTimeout(() => document.getElementById('pond-hint').classList.add('dismissed'), 9000);

    // Use the live renderer for previews so every variety is represented faithfully.
    function drawKoiSwatch(canvas, variety) {
      const ctx = canvas.getContext('2d');
      const koi = Fish.fromVariety(132, 56, 48, variety);
      koi.angle = 0; koi.vx = 0; koi.vy = 0; koi.tailPhase = 0;
      koi.patternSeed = 1.4;
      koi.draw(ctx);
    }

    function openPanel() {
      updateCardStates();
      panel.inert = false;
      btn.setAttribute('aria-expanded', 'true');
      panel.classList.add('visible');
      btn.classList.add('panel-open');
    }

    function closePanel() {
      panel.inert = true;
      btn.setAttribute('aria-expanded', 'false');
      panel.classList.remove('visible');
      btn.classList.remove('panel-open');
    }

    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (panel.classList.contains('visible')) {
        closePanel();
      } else {
        openPanel();
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && panel.classList.contains('visible')) { closePanel(); btn.focus(); }
    });

    // Close panel when clicking outside
    document.addEventListener('click', e => {
      if (!panel.contains(e.target) && e.target !== btn) {
        closePanel();
      }
    });
  </script>
</body>
</html>
